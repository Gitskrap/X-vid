name: xflow
description: Video-only Android client for X, based on XFlow.
publish_to: 'none'
version: 0.16.0+16

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  http: ^1.6.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  path_provider: ^2.1.3
  shared_preferences: ^2.5.3
  local_auth: ^3.0.2
  flutter_chrome_cast: ^2.0.0
  intl: ^0.20.2

  # Auth & Data Layer from Squawker
  webview_flutter: ^4.13.0
  webview_cookie_manager_plus: ^2.0.17
  sqflite: ^2.4.2
  ffcache: ^1.1.0
  crypto: ^3.0.3
  path: ^1.9.1
  flutter_svg: ^2.3.0

# Temporary compatibility pin: permission_handler_android 14.x requires compileSdk 37,
# while the upstream Flutter/AGP 9.0 application builds with compileSdk 36.
# Remove this override after an Android Gradle plugin / SDK upgrade.
dependency_overrides:
  permission_handler_android: 13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.svg
