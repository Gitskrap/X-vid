name: Twitter vidéo - APK Android
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Analyze app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test timestamp and engagement parsing
        run: flutter test test/core/utils/date_utils_test.dart test/core/utils/engagement_utils_test.dart test/core/database/engagement_cache_test.dart
      - name: Restore permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" || -z "${ANDROID_SIGNING_PASSWORD:-}" ]]; then
            echo "::error::Configure ANDROID_KEYSTORE_BASE64 and ANDROID_SIGNING_PASSWORD in Settings > Secrets and variables > Actions."
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/twitter-video-release.p12
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=twittervideo\nstoreFile=../twitter-video-release.p12\n' "$ANDROID_SIGNING_PASSWORD" "$ANDROID_SIGNING_PASSWORD" > android/key.properties
      - name: Build release ARM64
        run: flutter build apk --release --target-platform android-arm64 --build-name 0.8.0 --build-number 8
      - name: Name APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Twitter-video-0.8.0-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Twitter-video-Android-ARM64
          path: Twitter-video-0.8.0-arm64.apk
          if-no-files-found: error
          retention-days: 30
      - name: Clear local signing material
        if: always()
        shell: bash
        run: rm -f android/twitter-video-release.p12 android/key.properties
