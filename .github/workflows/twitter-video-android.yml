name: Twitter vidéo - APK Android
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze app
        run: flutter analyze --no-fatal-infos
        continue-on-error: true
      - name: Build release ARM64
        run: flutter build apk --release --target-platform android-arm64 --build-name 0.1.0 --build-number 1
      - name: Name APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Twitter-video-0.1.0-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Twitter-video-Android-ARM64
          path: Twitter-video-0.1.0-arm64.apk
          if-no-files-found: error
          retention-days: 30
